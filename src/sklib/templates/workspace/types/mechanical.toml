[[fields]]
name = "width"
label = "Width"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?mm$'
placeholder = "20mm"

[[fields]]
name = "height"
label = "Height"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?mm$'
placeholder = "5mm"

[[fields]]
name = "diameter"
label = "Diameter"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?mm$'
placeholder = "5mm"

[[fields]]
name = "mounting_method"
label = "Mounting method"
kind = "string"
placeholder = "Threaded"
