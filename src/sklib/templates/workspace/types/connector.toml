schema_version = 1
name = "connector"
label = "Connector"
plural = "Connectors"
prefix = "CON"
value_field = "mpn"

[[fields]]
name = "type"
label = "Type"
kind = "string"
required = true
placeholder = "Receptacle"

[[fields]]
name = "positions"
label = "Positions"
kind = "integer"
required = true
placeholder = "2"
help = "Manufacturer-defined contact count; excludes mechanical and shield tabs"

[[fields]]
name = "series"
label = "Series"
kind = "string"
placeholder = "JST PH"

[[fields]]
name = "rows"
label = "Rows"
kind = "integer"
placeholder = "1"

[[fields]]
name = "pitch"
label = "Pitch"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?mm$'
placeholder = "2.00mm"

[[fields]]
name = "gender"
label = "Gender"
kind = "string"
placeholder = "Female"

[[fields]]
name = "orientation"
label = "Orientation"
kind = "string"
placeholder = "Vertical"

[[fields]]
name = "mounting_type"
label = "Mounting type"
kind = "enum"
options = ["SMD", "TH", "SMT"]
help = "SMD is surface mount, TH is conventional through-hole, and SMT is surface-mounted through-hole"

[[fields]]
name = "termination_style"
label = "Termination style"
kind = "string"
placeholder = "Solder"
