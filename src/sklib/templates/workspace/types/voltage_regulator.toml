schema_version = 1
name = "voltage_regulator"
label = "Voltage regulator"
plural = "Voltage regulators"
prefix = "REG"
value_field = "mpn"

[[fields]]
name = "type"
label = "Type"
kind = "string"
required = true
placeholder = "LDO"

[[fields]]
name = "input_voltage"
label = "Input voltage"
kind = "string"
required = true
placeholder = "2.7V to 5.5V"

[[fields]]
name = "output_voltage"
label = "Output voltage"
kind = "string"
required = true
placeholder = "3.3V"

[[fields]]
name = "maximum_output_current"
label = "Maximum output current"
kind = "string"
required = true
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(uA|mA|A|kA)$'
placeholder = "500mA"

[[fields]]
name = "output_configuration"
label = "Output configuration"
kind = "string"
placeholder = "Fixed"

[[fields]]
name = "outputs"
label = "Outputs"
kind = "integer"
placeholder = "1"

[[fields]]
name = "switching_frequency"
label = "Switching frequency"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(Hz|kHz|MHz|GHz)$'
placeholder = "2.2MHz"

[[fields]]
name = "quiescent_current"
label = "Quiescent current"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(nA|uA|mA|A)$'
placeholder = "25uA"

[[fields]]
name = "package"
label = "Package"
kind = "string"
placeholder = "QFN-16"
