<dialog id="digikey-confirm-dialog" class="bg-gray-800 border border-gray-600 rounded-lg shadow-xl p-0 w-full max-w-md text-white">
    <div class="p-6">
        <h3 class="text-lg font-semibold mb-2">Override Existing Data?</h3>
        <p class="text-gray-300 mb-4">
            This will replace values for: <span id="override-fields" class="font-mono text-yellow-400"></span>
        </p>
        <div class="flex justify-end gap-3">
            <button id="digikey-confirm-cancel" type="button" class="px-4 py-2 border border-gray-600 rounded-md text-gray-300 hover:bg-gray-700">
                Cancel
            </button>
            <button id="digikey-confirm-override" type="button" class="px-4 py-2 bg-green-600 rounded-md text-white hover:bg-green-500">
                Override
            </button>
        </div>
    </div>
</dialog>
