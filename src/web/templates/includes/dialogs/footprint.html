<dialog id="footprint-dialog" class="bg-gray-800 border border-gray-600 rounded-lg shadow-xl p-0 w-full max-w-md text-white">
    <div class="p-6">
        <h3 class="text-lg font-semibold mb-2">Default Footprint</h3>
        <p class="text-gray-300 mb-1">
            Symbol <span id="dialog-symbol-name" class="font-mono text-blue-400"></span> has default footprint:
        </p>
        <p id="dialog-footprint" class="font-mono text-green-400 bg-gray-900 rounded px-3 py-2 text-sm mb-4"></p>
        <div class="flex justify-end gap-3">
            <button id="dialog-cancel" type="button" class="px-4 py-2 border border-gray-600 rounded-md text-gray-300 hover:bg-gray-700 transition-colors">
                Cancel
            </button>
            <button id="dialog-apply" type="button" class="px-4 py-2 bg-blue-600 rounded-md text-white hover:bg-blue-500 transition-colors">
                Apply
            </button>
        </div>
    </div>
</dialog>
