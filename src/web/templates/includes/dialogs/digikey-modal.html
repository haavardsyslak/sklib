<dialog id="digikey-modal" class="bg-gray-800 border border-gray-600 rounded-lg shadow-xl p-0 w-full max-w-2xl text-white">
    <div class="p-6">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold">DigiKey Search Results</h3>
            <button id="digikey-modal-close" type="button" class="text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="digikey-results" class="space-y-2 max-h-96 overflow-y-auto"></div>
        <div id="digikey-no-results" class="hidden text-gray-400 text-center py-8">
            No products found for this MPN
        </div>
        <div id="digikey-error" class="hidden text-red-400 text-center py-8"></div>
    </div>
</dialog>
