<fieldset>
    <legend class="text-lg font-semibold text-white mb-4">General Fields</legend>
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
        <div>
            <label for="package" class="block text-sm font-medium text-gray-300">Package</label>
            <input type="text" name="package" id="package" value="{{ component.package if component else '' }}"
                   placeholder="0603"
                   class="mt-1 block w-full rounded-md border-gray-600 bg-gray-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
        </div>

        <div>
            <label for="rated_voltage" class="block text-sm font-medium text-gray-300">Rated Voltage</label>
            <input type="text" name="rated_voltage" id="rated_voltage" value="{{ component.rated_voltage if component else '' }}"
                   placeholder="50V"
                   class="mt-1 block w-full rounded-md border-gray-600 bg-gray-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
        </div>

        <div>
            <label for="tolerance" class="block text-sm font-medium text-gray-300">Tolerance</label>
            <input type="text" name="tolerance" id="tolerance" value="{{ component.tolerance if component else '' }}"
                   placeholder="5%"
                   class="mt-1 block w-full rounded-md border-gray-600 bg-gray-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
        </div>

        <div>
            <label for="operating_temp" class="block text-sm font-medium text-gray-300">Operating Temp Range</label>
            <input type="text" name="operating_temp" id="operating_temp" value="{{ component.operating_temp if component else '' }}"
                   placeholder="-55C to +125C"
                   class="mt-1 block w-full rounded-md border-gray-600 bg-gray-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
        </div>
    </div>
</fieldset>
