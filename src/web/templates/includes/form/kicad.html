<fieldset>
    <legend class="text-lg font-semibold text-white mb-4">KiCad Mapping</legend>
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
        <div>
            <label for="symbol-search" class="block text-sm font-medium text-gray-300">Symbol <span class="text-red-500">*</span></label>
            <div id="symbol-selected-library" class="mb-1 hidden"></div>
            <div class="relative">
                <input type="text" id="symbol-search" placeholder="Search symbol or library..."
                       autocomplete="off"
                       class="w-full rounded-md border-gray-600 bg-gray-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm pr-20">
                <input type="hidden" name="symbol" id="symbol" value="{{ component.symbol if component else '' }}">
                <div id="symbol-filter" class="absolute right-2 top-1/2 -translate-y-1/2"></div>
            </div>
            <div id="symbol-results" class="symbol-results hidden absolute z-50 mt-1 w-full max-w-xl border border-gray-600 rounded-md bg-gray-900 max-h-64 overflow-y-auto shadow-lg"></div>
            <p class="mt-1 text-xs text-gray-500">Type to search. Click a library to filter, or select a symbol directly.</p>
        </div>

        <div>
            <label for="footprint-search" class="block text-sm font-medium text-gray-300">Footprint <span class="text-red-500">*</span></label>
            <div id="footprint-selected-library" class="mb-1 hidden"></div>
            <div class="relative">
                <input type="text" id="footprint-search" placeholder="Search footprint or library..."
                       autocomplete="off"
                       class="w-full rounded-md border-gray-600 bg-gray-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm pr-20">
                <input type="hidden" name="footprint" id="footprint" value="{{ component.footprint if component else '' }}">
                <div id="footprint-filter" class="absolute right-2 top-1/2 -translate-y-1/2"></div>
            </div>
            <div id="footprint-results" class="footprint-results hidden absolute z-50 mt-1 w-full max-w-xl border border-gray-600 rounded-md bg-gray-900 max-h-64 overflow-y-auto shadow-lg"></div>
            <p class="mt-1 text-xs text-gray-500">Type to search. Click a library to filter, or select a footprint directly.</p>
        </div>
    </div>
</fieldset>
