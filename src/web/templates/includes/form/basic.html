<fieldset>
    <legend class="text-lg font-semibold text-white mb-4">Basic Information</legend>
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
        <div>
            <label for="id" class="block text-sm font-medium text-gray-300">ID</label>
            <input type="text" name="id" id="id" value="{{ component.id if component else next_id }}"
                   class="mt-1 block w-full rounded-md border-gray-600 bg-gray-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                   {% if is_edit %}readonly{% endif %}>
            <p class="mt-1 text-xs text-gray-500">{{ type_info.prefix }}-XXXX format</p>
        </div>

        <div>
            <label for="mpn" class="block text-sm font-medium text-gray-300">MPN <span class="text-red-500">*</span></label>
            <div class="mt-1 flex gap-2">
                <input type="text" name="mpn" id="mpn" value="{{ component.mpn if component else '' }}"
                       required
                       class="flex-1 block w-full rounded-md border-gray-600 bg-gray-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                <button type="button" id="digikey-search"
                        class="px-3 py-2 bg-green-600 text-white text-sm rounded-md hover:bg-green-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                        disabled>
                    <i class="fa-solid fa-cloud-arrow-down mr-1"></i> Get from DigiKey
                </button>
            </div>
        </div>

        <div>
            <label for="manufacturer" class="block text-sm font-medium text-gray-300">Manufacturer <span class="text-red-500">*</span></label>
            <input type="text" name="manufacturer" id="manufacturer" value="{{ component.manufacturer if component else '' }}"
                   required
                   class="mt-1 block w-full rounded-md border-gray-600 bg-gray-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
        </div>

        <div>
            <label for="description" class="block text-sm font-medium text-gray-300">Description <span class="text-red-500">*</span></label>
            <input type="text" name="description" id="description" value="{{ component.description if component else '' }}"
                   required
                   class="mt-1 block w-full rounded-md border-gray-600 bg-gray-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
        </div>
    </div>
</fieldset>
