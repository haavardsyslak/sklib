<fieldset>
    <legend class="text-lg font-semibold text-white mb-4">{{ type_info.label }} Specifications</legend>
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
        {% for field in type_info.fields %}
        <div>
            <label for="{{ field.name }}" class="block text-sm font-medium text-gray-300">
                {{ field.label }}
                {% if field.required %}<span class="text-red-500">*</span>{% endif %}
            </label>

            {% if field.type == 'select' %}
            <select name="{{ field.name }}" id="{{ field.name }}"
                    {% if field.required %}required{% endif %}
                    class="mt-1 block w-full rounded-md border-gray-600 bg-gray-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                <option value="">Select...</option>
                {% for option in field.options %}
                <option value="{{ option }}" {% if component and component.extra_fields.get(field.name) == option %}selected{% endif %}>{{ option }}</option>
                {% endfor %}
            </select>
            {% elif field.type == 'number' %}
            <input type="number" name="{{ field.name }}" id="{{ field.name }}"
                   value="{{ component.extra_fields.get(field.name, '') if component else '' }}"
                   {% if field.required %}required{% endif %}
                   {% if field.placeholder %}placeholder="{{ field.placeholder }}"{% endif %}
                   class="mt-1 block w-full rounded-md border-gray-600 bg-gray-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
            {% else %}
            <input type="text" name="{{ field.name }}" id="{{ field.name }}"
                   value="{{ component.extra_fields.get(field.name, '') if component else '' }}"
                   {% if field.required %}required{% endif %}
                   {% if field.placeholder %}placeholder="{{ field.placeholder }}"{% endif %}
                   class="mt-1 block w-full rounded-md border-gray-600 bg-gray-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
            {% endif %}

            {% if field.help %}
            <p class="mt-1 text-xs text-gray-500">{{ field.help }}</p>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</fieldset>
