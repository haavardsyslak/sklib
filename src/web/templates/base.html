<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SKLib - KiCad Parts Library{% endblock %}</title>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    {% block extra_head %}
    {% endblock %}
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <nav class="bg-gray-800 shadow-lg border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center gap-2">
                        <i class="fa-solid fa-microchip text-blue-400 text-xl"></i>
                        <span class="font-semibold text-xl text-white">SKLib</span>
                    </a>
                    <div class="hidden sm:ml-8 sm:flex sm:space-x-4">
                        <a href="/components"
                           class="px-3 py-2 rounded-md text-sm font-medium {% if request.url.path == '/components' or '/components/' in request.url.path %}text-blue-400 bg-gray-700{% else %}text-gray-300 hover:text-white hover:bg-gray-700{% endif %}">
                            All Components
                        </a>
                        {% for type_key, type_info in component_types.items() %}
                        <a href="/components?component_type={{ type_key }}"
                           class="px-3 py-2 rounded-md text-sm font-medium {% if request.query_params.get('component_type') == type_key %}text-blue-400 bg-gray-700{% else %}text-gray-300 hover:text-white hover:bg-gray-700{% endif %}">
                            {{ type_info.label }}s
                        </a>
                        {% endfor %}
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/components/new?component_type={{ request.query_params.get('component_type', 'capacitor') }}"
                       class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-500">
                        <i class="fa-solid fa-plus"></i>
                        Add Part
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 border-t border-gray-700 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <p class="text-center text-sm text-gray-500">
                SKLib - KiCad Parts Library
            </p>
        </div>
    </footer>
</body>
</html>
