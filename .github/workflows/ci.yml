name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Validate example catalog
        run: uv run sklib check
      - name: Build example DBLib
        run: uv run sklib build
      - name: Build Python package
        run: uv build
      - name: Test installed package in fresh consumer workspace
        run: uv run python scripts/smoke_workspace.py
