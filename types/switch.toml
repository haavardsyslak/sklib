schema_version = 1
name = "switch"
label = "Switch"
plural = "Switches"
prefix = "SWT"
value_field = "mpn"

[[fields]]
name = "type"
label = "Type"
kind = "string"
required = true
placeholder = "Tactile"

[[fields]]
name = "contact_configuration"
label = "Contact configuration"
kind = "string"
required = true
placeholder = "SPST-NO"

[[fields]]
name = "action"
label = "Action"
kind = "string"
required = true
placeholder = "Momentary"

[[fields]]
name = "positions"
label = "Positions"
kind = "integer"
placeholder = "2"

[[fields]]
name = "actuator"
label = "Actuator"
kind = "string"
placeholder = "Lever"

[[fields]]
name = "mounting_type"
label = "Mounting type"
kind = "enum"
options = ["SMD", "TH", "SMT", "Panel", "Chassis"]

[[fields]]
name = "contact_rating"
label = "Contact rating"
kind = "string"
placeholder = "5A at 250V AC"
help = "Keep current, voltage, AC/DC, and load conditions together"

[[fields]]
name = "package"
label = "Package"
kind = "string"
placeholder = "6x6mm"
