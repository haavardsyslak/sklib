schema_version = 1
name = "processor"
label = "Processor"
plural = "Processors"
prefix = "PROC"
value_field = "mpn"

[[fields]]
name = "type"
label = "Type"
kind = "string"
required = true
placeholder = "MCU"

[[fields]]
name = "core"
label = "Core"
kind = "string"
required = true
placeholder = "Arm Cortex-M4"

[[fields]]
name = "maximum_clock_frequency"
label = "Maximum clock frequency"
kind = "string"
required = true
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(Hz|kHz|MHz|GHz)$'
placeholder = "168MHz"

[[fields]]
name = "family"
label = "Family"
kind = "string"
placeholder = "STM32F4"

[[fields]]
name = "cores"
label = "Cores"
kind = "integer"
placeholder = "1"

[[fields]]
name = "program_memory"
label = "Program memory"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(bit|Kbit|Mbit|Gbit|B|KB|MB|GB)$'
placeholder = "1MB"

[[fields]]
name = "ram"
label = "RAM"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(bit|Kbit|Mbit|Gbit|B|KB|MB|GB)$'
placeholder = "192KB"

[[fields]]
name = "supply_voltage"
label = "Supply voltage"
kind = "string"
placeholder = "1.8V to 3.6V"

[[fields]]
name = "interfaces"
label = "Interfaces"
kind = "string"
placeholder = "I2C, SPI, UART, USB, CAN"

[[fields]]
name = "package"
label = "Package"
kind = "string"
placeholder = "LQFP-100"
