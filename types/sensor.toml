schema_version = 1
name = "sensor"
label = "Sensor"
plural = "Sensors"
prefix = "SNS"
value_field = "mpn"

[[fields]]
name = "type"
label = "Type"
kind = "string"
required = true
placeholder = "Temperature"

[[fields]]
name = "interface"
label = "Interface"
kind = "string"
required = true
placeholder = "I2C"
help = "Examples: Analog, I2C, SPI, UART, 1-Wire, PWM, Resistance, or Capacitance"

[[fields]]
name = "measurement_range"
label = "Measurement range"
kind = "string"
placeholder = "-40C to 125C"

[[fields]]
name = "supply_voltage"
label = "Supply voltage"
kind = "string"
placeholder = "1.8V to 3.6V"

[[fields]]
name = "accuracy"
label = "Accuracy"
kind = "string"
placeholder = "0.2C"

[[fields]]
name = "resolution"
label = "Resolution"
kind = "string"
placeholder = "16bit"

[[fields]]
name = "axes"
label = "Axes"
kind = "integer"
placeholder = "3"

[[fields]]
name = "package"
label = "Package"
kind = "string"
placeholder = "DFN-6"
