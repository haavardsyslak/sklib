schema_version = 1
name = "diode"
label = "Diode"
plural = "Diodes"
prefix = "DIO"
value_field = "mpn"

[[fields]]
name = "type"
label = "Type"
kind = "string"
required = true
placeholder = "Schottky"
help = "Examples: Rectifier, Switching, Schottky, Zener, TVS, PIN, or Varactor"

[[fields]]
name = "configuration"
label = "Configuration"
kind = "string"
placeholder = "Single"

[[fields]]
name = "reverse_voltage"
label = "Reverse voltage"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(mV|V|kV)$'
placeholder = "40V"

[[fields]]
name = "average_forward_current"
label = "Average forward current"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(uA|mA|A|kA)$'
placeholder = "1A"
help = "Datasheet IF(AV); not surge, pulse, or test current"

[[fields]]
name = "breakdown_voltage"
label = "Breakdown voltage"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(mV|V|kV)$'
placeholder = "5.1V"

[[fields]]
name = "power_rating"
label = "Power rating"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(uW|mW|W|kW)$'
placeholder = "500mW"

[[fields]]
name = "package"
label = "Package"
kind = "string"
placeholder = "SOD-123"
