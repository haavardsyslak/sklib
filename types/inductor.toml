schema_version = 1
name = "inductor"
label = "Inductor"
plural = "Inductors"
prefix = "IND"
value_field = "inductance"
default_symbol = "Device:L_Small"

[[fields]]
name = "inductance"
label = "Inductance"
kind = "string"
required = true
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(nH|uH|mH|H)$'
placeholder = "4.7uH"
help = "Explicit ASCII unit such as 100nH, 4.7uH, or 1mH"

[[fields]]
name = "tolerance"
label = "Tolerance"
kind = "string"
required = true
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?%$'
placeholder = "20%"

[[fields]]
name = "rated_current"
label = "Rated current"
kind = "string"
required = true
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(uA|mA|A)$'
placeholder = "1.5A"

[[fields]]
name = "dcr"
label = "DC resistance"
kind = "string"
required = true
pattern = '^(0|[1-9][0-9]*)(u|m|R|k|Meg|G)[0-9]*$'
placeholder = "120m"
help = "Resistor notation such as 120m or 1R2"

[[fields]]
name = "saturation_current"
label = "Saturation current"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(uA|mA|A)$'
placeholder = "2A"

[[fields]]
name = "self_resonant_frequency"
label = "Self-resonant frequency"
kind = "string"
pattern = '^(0|[1-9][0-9]*)(\.[0-9]+)?(Hz|kHz|MHz|GHz)$'
placeholder = "30MHz"

[[fields]]
name = "shielding"
label = "Shielding"
kind = "enum"
options = ["Shielded", "Semi-shielded", "Unshielded"]

[[fields]]
name = "type"
label = "Type"
kind = "string"
placeholder = "Power"

[[fields]]
name = "package"
label = "Package"
kind = "string"
placeholder = "0805"
